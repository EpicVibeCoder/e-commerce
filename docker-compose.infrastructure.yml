# compose.yaml
name: ecommerce-platform

services:
  # Infrastructure Services
  mysql:
    image: mysql:8.4 # 8.4 is the current Long Term Support (LTS) standard
    container_name: ecommerce-mysql-dev
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=200
      - --innodb_buffer_pool_size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce_db}
      MYSQL_USER: ${DB_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_password}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine # UPDATED: Redis 8 is the new stable standard (since late 2025)
    container_name: ecommerce-redis-dev
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_dev_data:/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_dev_data:
  redis_dev_data:

networks:
  ecommerce-network:
    driver: bridge