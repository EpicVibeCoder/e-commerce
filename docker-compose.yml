services:
      postgres:
            # UPGRADE: v18.1 for UUIDv7 (faster indexing) and Async I/O
            image: postgres:18.2-alpine
            container_name: ecommerce-postgres
            environment:
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres} # Use env var for security
                  POSTGRES_DB: ecommerce
            ports:
                  - "5432:5432"
            volumes:
                  # UPGRADE: Standard path works, but AIO works best on Linux volumes
                  - postgres_data:/var/lib/postgresql/data
            healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

      redis:
            # UPGRADE: Valkey 8.1 for 28% better memory efficiency (crucial for massive catalogues)
            image: valkey/valkey:8.1.5-alpine
            container_name: ecommerce-valkey
            command: ["valkey-server", "--maxmemory 2gb", "--maxmemory-policy allkeys-lru", "--save 60 1"]
            ports:
                  - "6379:6379"
            volumes:
                  - redis_data:/data
            healthcheck:
                  test: ["CMD", "valkey-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

volumes:
      postgres_data:
      redis_data:
