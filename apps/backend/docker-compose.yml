services:
  mysql:
    image: mysql:8.4
    container_name: mini-ecommerce-mysql
    restart: unless-stopped
    # ENCODING: Using modern '0900' collation (faster/more accurate than unicode_ci)
    # AUTH: MySQL 8.4 uses caching_sha2_password by default (compatible with Prisma)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=200
      - --innodb_buffer_pool_size=256M
    
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mini-commerce-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: mini-commerce-redis
    restart: unless-stopped
    # PERSISTENCE: Explicitly enable AOF (Append Only File) for durability
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - mini-commerce-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
  api:
      build:
        context: .
        dockerfile: dockerfile
      container_name: mini-ecommerce-api
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "3000:3000"
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - mini-commerce-network
      environment:
      # Override DATABASE_URL to use service name
        DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}?allowPublicKeyRetrieval=true
        REDIS_HOST: redis
        STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}


  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: stripe-cli
    restart: unless-stopped
    command: listen --forward-to "http://api:3000/api/v1/payments/webhooks/stripe"
    depends_on:
      - api
    networks:
      - mini-commerce-network
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY}
volumes:
  mysql_data:
  redis_data:

networks:
  mini-commerce-network:
    driver: bridge
