name: CI

on:
      push:
            branches: [main]
      pull_request:
            branches: [main]

concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

jobs:
      api:
            name: API
            runs-on: ubuntu-latest
            timeout-minutes: 15
            defaults:
                  run:
                        working-directory: apps/api
            services:
                  postgres:
                        image: postgres:18-alpine
                        env:
                              POSTGRES_USER: postgres
                              POSTGRES_PASSWORD: postgres
                              POSTGRES_DB: ecommerce
                        ports:
                              - 5432:5432
                        options: >-
                              --health-cmd "pg_isready -U postgres -d ecommerce"
                              --health-interval 10s
                              --health-timeout 5s
                              --health-retries 5
            env:
                  APP_ENV: development
                  PORT: "3000"
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce
                  CORS_ORIGINS: http://localhost:3001,http://localhost:3002
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-node@v4
                    with:
                          node-version: "24"
                          cache: npm
                          cache-dependency-path: apps/api/package-lock.json
                  - run: cp .env.example .env
                    working-directory: .
                  - run: npm ci
                  - run: npm run db:generate
                  - run: npm run db:migrate:deploy
                  - run: npm run lint:ci
                  - run: npm run check-types
                  - run: npm test
                  - run: npm run build

      storefront:
            name: Storefront
            runs-on: ubuntu-latest
            timeout-minutes: 15
            defaults:
                  run:
                        working-directory: apps/storefront
            env:
                  NEXT_PUBLIC_API_URL: http://localhost:3000
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-node@v4
                    with:
                          node-version: "24"
                          cache: npm
                          cache-dependency-path: apps/storefront/package-lock.json
                  - run: npm ci
                  - run: npm run lint
                  - run: npm run check-types
                  - run: npm run build

      admin:
            name: Admin
            runs-on: ubuntu-latest
            timeout-minutes: 15
            defaults:
                  run:
                        working-directory: apps/admin
            env:
                  NEXT_PUBLIC_API_URL: http://localhost:3000
            steps:
                  - uses: actions/checkout@v4
                  - uses: actions/setup-node@v4
                    with:
                          node-version: "24"
                          cache: npm
                          cache-dependency-path: apps/admin/package-lock.json
                  - run: npm ci
                  - run: npm run format
                  - run: npm run lint
                  - run: npm run check-types
                  - run: npm run build
